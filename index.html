<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TinCan</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#1f3a5f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TinCan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      The loading screen: the icon, filling the screen, its sound bars moving.
      Styled here rather than in the app's stylesheet, so it shows before any
      script or style has loaded. The app takes it away (see src/splash.ts).
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #1f3a5f;
        color: #f4e9cd;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.3s ease;
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: min(60vw, 15rem);
        height: auto;
      }
      #splash p {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      /* Each bar swells and shrinks about its middle, one after the next, so a wave runs across them. */
      #splash .bars path {
        transform-origin: 0 314px;
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      #splash .bars path:nth-child(1) { --low: 0.5; --high: 1.7; }
      #splash .bars path:nth-child(2) { --low: 0.45; --high: 1.3; animation-delay: -0.9s; }
      #splash .bars path:nth-child(3) { --low: 0.4; --high: 1.1; animation-delay: -0.7s; }
      #splash .bars path:nth-child(4) { --low: 0.45; --high: 1.5; animation-delay: -0.5s; }
      #splash .bars path:nth-child(5) { --low: 0.5; --high: 1.9; animation-delay: -0.3s; }
      @keyframes splash-bar {
        0%, 100% { transform: scaleY(var(--low)); }
        50% { transform: scaleY(var(--high)); }
      }
      /* Still, the bars are the icon's own. */
      @media (prefers-reduced-motion: reduce) {
        #splash .bars path { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status">
      <!-- The drawing of public/icon.svg, with each sound bar its own path. -->
      <svg viewBox="96 144 320 240" aria-hidden="true">
        <path d="M150 268 A106 106 0 0 1 362 268" fill="none" stroke="#f4e9cd" stroke-width="20" stroke-linecap="round"/>
        <g transform="translate(152 314) scale(-0.62 1)">
          <ellipse cx="56" cy="0" rx="19" ry="60" fill="#a9b6c2"/>
          <rect x="-56" y="-60" width="112" height="120" fill="#c5cfd8"/>
          <path d="M-24 -60 v120 M8 -60 v120 M40 -60 v120" stroke="#93a1ae" stroke-width="7"/>
          <ellipse cx="-56" cy="0" rx="23" ry="60" fill="#e3e9ee"/>
          <ellipse cx="-56" cy="0" rx="15" ry="49" fill="#56636f"/>
        </g>
        <g transform="translate(360 314) scale(0.62 1)">
          <ellipse cx="56" cy="0" rx="19" ry="60" fill="#a9b6c2"/>
          <rect x="-56" y="-60" width="112" height="120" fill="#c5cfd8"/>
          <path d="M-24 -60 v120 M8 -60 v120 M40 -60 v120" stroke="#93a1ae" stroke-width="7"/>
          <ellipse cx="-56" cy="0" rx="23" ry="60" fill="#e3e9ee"/>
          <ellipse cx="-56" cy="0" rx="15" ry="49" fill="#56636f"/>
        </g>
        <g class="bars" fill="none" stroke="#f4e9cd" stroke-width="12" stroke-linecap="round">
          <path d="M228 299 v30"/>
          <path d="M242 284 v60"/>
          <path d="M256 272 v84"/>
          <path d="M270 290 v48"/>
          <path d="M284 301 v26"/>
        </g>
      </svg>
      <p>Loading…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
