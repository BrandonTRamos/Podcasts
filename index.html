<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TinCan</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#1f3a5f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TinCan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      The loading screen: the icon, filling the screen, its sound bars moving.
      Styled here rather than in the app's stylesheet, so it shows before any
      script or style has loaded. The app takes it away (see src/splash.ts).
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #1f3a5f;
        color: #f4e9cd;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.3s ease;
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: min(60vw, 15rem);
        height: auto;
      }
      #splash p {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      /* Each bar swells and shrinks about its middle, one after the next, so a wave runs across them. */
      #splash .bars path {
        transform-origin: 0 291px;
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      #splash .bars path:nth-child(1) { --low: 0.5; --high: 1.8; }
      #splash .bars path:nth-child(2) { --low: 0.45; --high: 1.4; animation-delay: -0.9s; }
      #splash .bars path:nth-child(3) { --low: 0.4; --high: 1.1; animation-delay: -0.7s; }
      #splash .bars path:nth-child(4) { --low: 0.45; --high: 1.4; animation-delay: -0.5s; }
      #splash .bars path:nth-child(5) { --low: 0.5; --high: 1.8; animation-delay: -0.3s; }
      @keyframes splash-bar {
        0%, 100% { transform: scaleY(var(--low)); }
        50% { transform: scaleY(var(--high)); }
      }
      /* Still, the bars are the icon's own. */
      @media (prefers-reduced-motion: reduce) {
        #splash .bars path { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status">
      <!-- The drawing of public/icon.svg, with each sound bar its own path. -->
      <svg viewBox="80 96 352 272" aria-hidden="true">
        <defs>
          <linearGradient id="splash-tin" gradientUnits="userSpaceOnUse" x1="0" y1="-69.2" x2="0" y2="69.2">
            <stop offset="0" stop-color="#ccd2da"/>
            <stop offset="0.28" stop-color="#eaecf0"/>
            <stop offset="0.49" stop-color="#c0c7d2"/>
            <stop offset="0.75" stop-color="#b4bcc6"/>
            <stop offset="1" stop-color="#b0b8c4"/>
          </linearGradient>
          <linearGradient id="splash-rib" gradientUnits="userSpaceOnUse" x1="0" y1="-69.2" x2="0" y2="69.2">
            <stop offset="0" stop-color="#a1abb9"/>
            <stop offset="0.28" stop-color="#a5aebb"/>
            <stop offset="0.49" stop-color="#969fae"/>
            <stop offset="1" stop-color="#909bab"/>
          </linearGradient>
          <clipPath id="splash-can-side">
            <path d="M0 -69.2 H-73.5 A22.5 69.2 0 0 0 -73.5 69.2 H0 Z"/>
          </clipPath>
          <g id="splash-can">
            <g clip-path="url(#splash-can-side)">
              <rect x="-96" y="-69.2" width="96" height="138.4" fill="url(#splash-tin)"/>
              <path d="M-56.8 -73.5 a20.6 73.5 0 0 0 0 147 M-37.4 -73.5 a20.6 73.5 0 0 0 0 147 M-18 -73.5 a20.6 73.5 0 0 0 0 147" fill="none" stroke="url(#splash-rib)" stroke-width="5.5"/>
            </g>
            <ellipse rx="18.8" ry="69.2" fill="#eff0f3"/>
            <ellipse cx="0.5" rx="13.3" ry="60.2" fill="#2e3c4c"/>
          </g>
        </defs>
        <path d="M129 228.5 A127 127.5 0 0 1 383 228.5 H362 A106 103.5 0 0 0 150 228.5 Z" fill="#fdf3de"/>
        <use href="#splash-can" transform="translate(181.3 292.5)"/>
        <use href="#splash-can" transform="translate(330.7 292.5) scale(-1 1)"/>
        <g class="bars" fill="none" stroke="#07e6ec" stroke-width="12" stroke-linecap="round">
          <path d="M217 280 v22"/>
          <path d="M236.5 266 v50"/>
          <path d="M256 247 v88"/>
          <path d="M275.5 266 v50"/>
          <path d="M295 280 v22"/>
        </g>
      </svg>
      <p>Loading…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
