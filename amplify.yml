# Amplify Hosting build for the `main` branch (production). Amplify runs the
# backend phase, then the frontend phase; any failing command stops the build,
# and nothing is deployed. `npm run check` and a trial `npm run build` run before
# the backend deploys, so a commit that fails lint, typecheck, tests or the build
# never reaches production, not even its backend half (spec, "Delivery").
version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
        - npm run check
        - npm run build
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
